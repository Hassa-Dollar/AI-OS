# Models eligible for routing (contract: architecture/contracts/roster.schema.md, ADR-0031).
#
# Scores are SWE-bench Verified under the mini-swe-agent harness (vals.ai, updated 2026-09-01) as
# "accuracy @ cost per task". Where an entry is the successor of the model that was measured, that's
# noted, and it must pass `aios models probe` before it gets routed real work.
#
# Tiers: T1 cheap, T2 strong open-weight, T3 frontier. P8 needs >= 2 families per tier; T2 has 3.
